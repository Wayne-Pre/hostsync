name: self-check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: selfcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostsync
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hostsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/hostsync
      TZ: Africa/Nairobi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: hostsync/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: hostsync
      - name: Typecheck, bundle, migrate and run every test
        run: node scripts/selfcheck.mjs
        working-directory: hostsync
